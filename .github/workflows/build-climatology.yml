name: Build Copernicus ERA5 climatology

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  climatology:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure CDS API
        env:
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          if [ -z "$CDS_API_URL" ]; then
            echo "::error::CDS_API_URL is missing"
            exit 1
          fi

          if [ -z "$CDS_API_KEY" ]; then
            echo "::error::CDS_API_KEY is missing"
            exit 1
          fi

          printf 'url: %s\nkey: %s\n' \
            "$CDS_API_URL" \
            "$CDS_API_KEY" \
            > "$HOME/.cdsapirc"

          chmod 600 "$HOME/.cdsapirc"

      - name: Download ERA5 and build climatology
        env:
          LATITUDE: "50.5279"
          LONGITUDE: "4.5284"
        run: python scripts/build_climatology.py

      - name: Commit climatology
        run: |
          git config user.name "climate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/climatology_1961_1990.csv

          if git diff --cached --quiet; then
            echo "No climatology changes"
            exit 0
          fi

          git commit -m "Build ERA5 climatology 1961-1990"
          git pull --rebase
          git push
