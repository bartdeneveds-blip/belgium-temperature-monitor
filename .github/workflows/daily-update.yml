name: Daily ECMWF temperature update

on:
  schedule:
    # Dagelijks om 07:30 UTC.
    # Dat is 08:30 Belgische wintertijd
    # en 09:30 Belgische zomertijd.
    - cron: "30 7 * * *"

  workflow_dispatch:

concurrency:
  group: daily-belgium-temperature-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Update ECMWF forecast and ERA5T history
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required files
        run: |
          test -s data/climatology_1961_1990.csv
          test -s scripts/update_latest_era5t.py
          test -s scripts/update_forecast.py
          test -s scripts/validate_csv.py

      - name: Configure Copernicus CDS API
        env:
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          if [ -z "$CDS_API_URL" ]; then
            echo "::error::CDS_API_URL is missing"
            exit 1
          fi

          if [ -z "$CDS_API_KEY" ]; then
            echo "::error::CDS_API_KEY is missing"
            exit 1
          fi

          printf 'url: %s\nkey: %s\n' \
            "$CDS_API_URL" \
            "$CDS_API_KEY" \
            > "$HOME/.cdsapirc"

          chmod 600 "$HOME/.cdsapirc"

      - name: Download latest ECMWF forecast
        env:
          LATITUDE: "50.5279"
          LONGITUDE: "4.5284"
          TIMEZONE: "Europe/Brussels"
          FORECAST_DAYS: "10"
        run: python scripts/update_forecast.py

      - name: Update missing ERA5T days
        env:
          BACKFILL_YEAR: "2026"
          ERA5_LAG_DAYS: "5"
          LATITUDE: "50.5279"
          LONGITUDE: "4.5284"
        run: python scripts/update_latest_era5t.py

      - name: Validate combined CSV
        run: python scripts/validate_csv.py

      - name: Validate ERA5T-only CSV
        run: |
          test -s data/belgium_temperature_anomaly_era5t.csv

          python - <<'PY'
          import pandas as pd

          path = "data/belgium_temperature_anomaly_era5t.csv"
          data = pd.read_csv(path)

          required = {
              "date",
              "forecast_max_c",
              "historic_norm_c",
              "anomaly_c",
              "status",
              "latitude",
              "longitude",
          }

          missing = required - set(data.columns)

          if missing:
              raise RuntimeError(
                  f"Missing columns: {sorted(missing)}"
              )

          if data.empty:
              raise RuntimeError(
                  "ERA5T-only CSV is empty"
              )

          if not data["status"].eq("era5t").all():
              raise RuntimeError(
                  "ERA5T-only CSV contains forecast rows"
              )

          dates = pd.to_datetime(
              data["date"],
              errors="raise",
          )

          if dates.duplicated().any():
              raise RuntimeError(
                  "ERA5T-only CSV contains duplicate dates"
              )

          expected = (
              data["forecast_max_c"]
              - data["historic_norm_c"]
          ).round(2)

          actual = data["anomaly_c"].round(2)

          if not expected.equals(actual):
              raise RuntimeError(
                  "Anomaly calculation mismatch"
              )

          print(f"Validated {len(data)} ERA5T rows")
          print(f"First date: {dates.min().date()}")
          print(f"Last date:  {dates.max().date()}")
          PY

      - name: Show data summary
        run: |
          echo "Combined CSV status counts:"

          python - <<'PY'
          import pandas as pd

          combined = pd.read_csv(
              "data/belgium_temperature_anomaly.csv"
          )

          era5t = pd.read_csv(
              "data/belgium_temperature_anomaly_era5t.csv"
          )

          print(
              combined["status"]
              .value_counts(dropna=False)
              .to_string()
          )

          print()
          print(
              f"Combined rows: {len(combined)}"
          )
          print(
              f"ERA5T-only rows: {len(era5t)}"
          )
          print(
              f"ERA5T first date: {era5t['date'].min()}"
          )
          print(
              f"ERA5T last date: {era5t['date'].max()}"
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "climate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/belgium_temperature_anomaly.csv
          git add data/belgium_temperature_anomaly_era5t.csv

          if [ -f data/run_metadata.json ]; then
            git add data/run_metadata.json
          fi

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Update ERA5T history and ECMWF forecast"
          git pull --rebase
          git push
