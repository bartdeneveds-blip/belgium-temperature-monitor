name: Daily ECMWF temperature update

on:
  schedule:
    # Dagelijks om 07:30 UTC
    # 08:30 Belgische wintertijd
    # 09:30 Belgische zomertijd
    - cron: "30 7 * * *"

  # Maakt het mogelijk om de workflow handmatig te testen
  workflow_dispatch:

concurrency:
  group: daily-ecmwf-temperature
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Historische norm controleren
        run: test -s data/climatology_1961_1990.csv

      - name: ECMWF-data downloaden en CSV bijwerken
        env:
          LATITUDE: "50.5279"
          LONGITUDE: "4.5284"
          TIMEZONE: "Europe/Brussels"
          FORECAST_DAYS: "10"
        run: python scripts/update_forecast.py

      - name: CSV controleren
        run: python scripts/validate_csv.py

      - name: Wijzigingen committen
        run: |
          git config user.name "climate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/belgium_temperature_anomaly.csv
          git add data/run_metadata.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen gevonden"
            exit 0
          fi

          git commit -m "Update ECMWF temperature forecast"
          git pull --rebase
          git push
